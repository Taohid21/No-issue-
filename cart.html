<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Taqwa</title>
  
  <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/gk5mjX3b/FB-IMG-1788513813978.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="antialiased selection:bg-black selection:text-white">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-9 h-9 rounded-lg border border-gray-200 flex items-center justify-center text-black hover:bg-gray-50 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <h1 class="text-base sm:text-lg font-bold text-black">Shopping Cart (<span id="cartCountHeader">0</span>)</h1>
      </div>
      <button onclick="clearCart()" class="text-xs font-semibold text-gray-400 hover:text-black transition">Clear All</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- Empty Cart State -->
    <div id="cartEmptyState" class="hidden text-center py-20 bg-white rounded-2xl border border-gray-100 p-8">
      <div class="w-14 h-14 bg-gray-50 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-100">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
      </div>
      <h3 class="text-base font-bold text-black mb-1">Your cart is empty</h3>
      <p class="text-xs text-gray-500 mb-6">Looks like you haven't added any products yet.</p>
      <a href="index.html" class="inline-block bg-black hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-xs font-semibold transition">
        Continue Shopping
      </a>
    </div>

    <!-- Active Cart Items -->
    <div id="cartContent" class="space-y-6">
      <div id="cartItemsList" class="space-y-3"></div>

      <!-- Price Breakdown Card -->
      <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-3 text-xs sm:text-sm">
        <div class="flex justify-between text-gray-500">
          <span>Subtotal</span>
          <span class="font-bold text-black" id="subtotalPrice">BDT 0</span>
        </div>
        <div class="flex justify-between text-gray-500">
          <span>Estimated Delivery</span>
          <span class="text-gray-400">Calculated at checkout</span>
        </div>
        <div class="border-t border-gray-100 pt-3 flex justify-between text-base font-bold text-black">
          <span>Total</span>
          <span id="grandTotalPrice">BDT 0</span>
        </div>

        <button onclick="proceedToCheckout()" class="w-full mt-4 bg-black hover:bg-gray-800 text-white py-3.5 rounded-xl font-bold text-xs tracking-wider uppercase transition active:scale-[0.99]">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </main>

  <script>
    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem('taqwa_cart') || '[]');
      renderCart();
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');

      const totalItems = cart.reduce((acc, it) => acc + (it.quantity || 1), 0);
      headerCount.innerText = totalItems;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;

      cart.forEach((item, index) => {
        subtotal += item.price * item.quantity;

        const el = document.createElement('div');
        el.className = "bg-white p-4 rounded-xl border border-gray-100 flex gap-4 items-center";

        let sizeSelect = '';
        if (item.sizes && item.sizes.length > 0) {
          sizeSelect = `
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="text-[11px] text-gray-400 font-medium">Size:</span>
              <select onchange="updateVariant(${index}, 'selectedSize', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5 outline-none font-semibold">
                ${item.sizes.map(s => {
                  const val = typeof s === 'object' ? s.size : s;
                  return `<option value="${val}" ${val === item.selectedSize ? 'selected' : ''}>${val}</option>`;
                }).join('')}
              </select>
            </div>
          `;
        }

        let colorSelect = '';
        if (item.colors && item.colors.length > 0) {
          colorSelect = `
            <div class="flex items-center gap-1.5 mt-1">
              <span class="text-[11px] text-gray-400 font-medium">Color:</span>
              <select onchange="updateVariant(${index}, 'selectedColor', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5 outline-none font-semibold">
                ${item.colors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
          `;
        }

        el.innerHTML = `
          <img src="${item.imageUrl}" alt="${item.name}" class="w-20 h-24 object-cover rounded-lg border border-gray-100">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start">
              <h4 class="text-xs sm:text-sm font-semibold text-black truncate">${item.name}</h4>
              <button onclick="removeItem(${index})" class="text-gray-400 hover:text-black p-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="text-xs font-bold text-black mt-1">BDT ${item.price}</div>
            
            <div class="flex flex-wrap items-center gap-3">
              ${sizeSelect}
              ${colorSelect}
            </div>

            <div class="flex items-center gap-2 mt-3">
              <button onclick="changeQty(${index}, -1)" class="w-6 h-6 rounded border border-gray-200 bg-gray-50 flex items-center justify-center font-bold text-xs hover:bg-gray-100">-</button>
              <span class="text-xs font-bold w-6 text-center">${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)" class="w-6 h-6 rounded border border-gray-200 bg-gray-50 flex items-center justify-center font-bold text-xs hover:bg-gray-100">+</button>
            </div>
          </div>
        `;
        list.appendChild(el);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;
      lucide.createIcons();
    }

    function changeQty(index, delta) {
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      localStorage.setItem('taqwa_cart', JSON.stringify(cart));
      renderCart();
    }

    function updateVariant(index, key, val) {
      cart[index][key] = val;
      localStorage.setItem('taqwa_cart', JSON.stringify(cart));
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem('taqwa_cart', JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('Are you sure you want to clear your cart?')) {
        cart = [];
        localStorage.removeItem('taqwa_cart');
        renderCart();
      }
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true`;
    }

    loadCart();
  </script>
</body>
</html>
